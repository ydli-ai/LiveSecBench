# -- 在这里配置评测使用的相关信息 --

# 评测任务的基本信息
eval_run_name: "2025_12_01_LiveSecBench_Eval"
description: "在多个安全维度上对一批模型进行综合评测"

# 定义待评测的模型（以下为示例 Mock 数据，实际使用时请替换为真实模型）
models_to_test:
  - model_name: "Mock Secure Alpha"
    enabled: true
    model_detail_url: "https://mock.local/models/alpha"
    organization: "MockAI Lab"
    location: "海外"
    calling_method: "API"
    is_reasoning: false
    image_text_input: true
    image_source_priority: url  # 优先使用 CDN URL
    use_structured_content: false
    open_source: false
    publish_time: "2024/01/01"
    api_config:
      base_url: "https://mock-alpha.api/v1"  # API 端点（支持 env_var: 格式）
      end_point: "/chat/completions"  # API 路由（可自定义）
      api_key: "env_var:MOCK_ALPHA_API_KEY"  # API 密钥（支持 env_var: 格式）
      model_id: "mock-alpha"  # 模型ID
      provider: "mock-provider"  # 供应商
      provider_ignore: []
      max_concurrent: 1
      rpm: 60
      tpm: 0
      estimated_tokens_per_request: 4000
  - model_name: "Mock Secure Beta"
    enabled: true
    model_detail_url: "https://mock.local/models/beta"
    organization: "MockAI Lab"
    location: "国内"
    calling_method: "API"
    is_reasoning: true
    image_text_input: true
    image_source_priority: local  # 优先读取本地文件
    use_structured_content: false
    open_source: true
    publish_time: "2024/02/01"
    api_config:
      base_url: "https://mock-beta.api/v1"  # API 端点（支持 env_var: 格式）
      end_point: "/chat/completions"  # API 路由（可自定义）
      api_key: "env_var:MOCK_BETA_API_KEY"  # API 密钥（支持 env_var: 格式）
      model_id: "mock-beta"  # 模型ID
      provider: "mock-provider"  # 供应商
      provider_ignore: []
      max_concurrent: 5
      rpm: 30
      tpm: 0
      estimated_tokens_per_request: 4000

  # ---------- 文生图模型示例（task_type: text_to_image，按 api_provider 区分后端）----------
  # SiliconFlow 文生图
  - model_name: "Kolors (SiliconFlow)"
    enabled: false
    task_type: text_to_image
    organization: "SiliconFlow"
    api_config:
      api_provider: siliconflow
      base_url: "https://api.siliconflow.cn/v1"
      end_point: "images/generations"
      api_key: "env_var:SILICONFLOW_API_KEY"
      model_id: "Kwai-Kolors/Kolors"
      max_concurrent: 2
      rpm: 20
    image_generation:
      image_size: "1024x1024"
      batch_size: 1
      num_inference_steps: 20
      guidance_scale: 7.5
  # SD WebUI 文生图（本地 /sdapi/v1/txt2img）
  - model_name: "SD WebUI Local"
    enabled: false
    task_type: text_to_image
    organization: "Local"
    api_config:
      api_provider: sd_webui
      base_url: "http://127.0.0.1:7860"
      end_point: "sdapi/v1/txt2img"
      api_key: ""  # 本地通常无
      model_id: "sd-webui"
      max_concurrent: 1
    image_generation:
      width: 512
      height: 768
      steps: 20
      cfg_scale: 7
      negative_prompt: "lowres, blurry"
  # ComfyUI 文生图（需提供 workflow 模板，占位符 {prompt}）
  - model_name: "ComfyUI Local"
    enabled: false
    task_type: text_to_image
    organization: "Local"
    api_config:
      api_provider: comfyui
      base_url: "http://127.0.0.1:8188"
      end_point: "prompt"
      api_key: ""
      model_id: "comfyui"
      max_concurrent: 1
      workflow_template_path: "configs/comfyui_txt2img_workflow.json"  # 可选，或使用 workflow_inline
    image_generation:
      width: 512
      height: 768
      steps: 20

model_error_handlers:
