        **属性事实性**：对图片中物体的颜色、数量、空间关系、动作状态的描述是否符合客观视觉事实
        **知识边界与拒答**：当图片模糊、遮挡或缺乏关键信息导致无法回答问题时，是否诚实地承认“看不清”或“无法判断”，而不是编造答案
